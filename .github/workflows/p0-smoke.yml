name: P0 smoke tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  evidence-tooling:
    name: Evidence tooling (stdlib only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      LC_ALL: C.UTF-8
      MULTISCREEN_EVIDENCE_REVIEWERS: ""
      MULTISCREEN_EVIDENCE_ARCHIVE_DIR: ""
      MULTISCREEN_P0_4_RAW_ROOT: ""
      MULTISCREEN_EVIDENCE_PUBLIC_RELEASE_TAG: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile dependency-free evidence tools
        run: |
          python -S -m py_compile \
            scripts/collect_validation_provenance.py \
            scripts/validation_evidence_common.py \
            scripts/package_validation_evidence.py \
            scripts/verify_validation_evidence.py \
            scripts/build_level1_evidence.py \
            scripts/check_level1_offline_cache.py \
            scripts/check_level1_repository.py \
            scripts/p0_3_evidence_contract.py \
            scripts/p0_4_evidence_contract.py \
            scripts/report_level1_environment.py \
            scripts/run_level1_requalification_command.py \
            scripts/review_level1_requalification.py \
            tests/test_level1_evidence_builder.py \
            tests/test_level1_offline_cache.py \
            tests/test_level1_*.py \
            tests/test_validation_evidence*.py

      - name: Synthetic evidence-tooling tests
        run: python -S -m unittest discover -s tests -p 'test_validation_evidence*.py' -v

      - name: Synthetic Level 1 evidence-support tests
        run: python -S -m unittest discover -s tests -p 'test_level1_*.py' -v

  c1-lower-bound:
    name: P0.5-C1 declared lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up minimum Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install declared lower bounds
        run: |
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.4.0+cpu"
          python -m pip install "transformers==4.57.6"
          python -m pip install -e . --no-deps

      - name: Verify pinned environment
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import torch
          import transformers

          assert version("torch").startswith("2.4.0")
          assert version("transformers") == "4.57.6"
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          PY

      - name: Run P0.5-C1 focused contracts
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile \
            scripts/generate_paper_scale_manifest.py \
            tests/test_paper_architecture_contract.py \
            tests/test_paper_initialization_contract.py \
            tests/test_packed_text_contract.py
          python -m unittest discover -s tests -p 'test_paper_architecture_contract.py' -v
          python -m unittest discover -s tests -p 'test_paper_initialization_contract.py' -v
          python -m unittest discover -s tests -p 'test_packed_text_contract.py' -v
          python scripts/generate_paper_scale_manifest.py \
            --check docs/validation_results/P0_5_C1_ARCHITECTURE_MANIFEST.json
          python -m json.tool \
            docs/validation_results/P0_5_C1_ARCHITECTURE_MANIFEST.json \
            >/dev/null

      - name: Run P0.5-C2 MiPE position and cache contracts
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile tests/test_mipe_position_cache_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_mipe_position_cache_contract.py' \
            -v

      - name: Run P1-preflight B gradient-checkpointing contract
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile tests/test_gradient_checkpointing_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_gradient_checkpointing_contract.py' \
            -v

      - name: Run P0.5-C3 paper training contract
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile tests/test_paper_training_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_paper_training_contract.py' \
            -v

  gradient-checkpointing-compat:
    name: P1-preflight B (Transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - transformers: "4.57.6"
            torch: "2.4.0+cpu"
          - transformers: "5.14.1"
            torch: "2.8.0+cpu"
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install exact compatibility lane
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==${{ matrix.torch }}"
          python -m pip install \
            "transformers==${{ matrix.transformers }}" \
            "safetensors>=0.4.5"
          python -m pip install -e . --no-deps

      - name: Verify exact lane
        run: |
          python - <<'PY'
          import torch
          import transformers

          assert torch.__version__ == "${{ matrix.torch }}"
          assert transformers.__version__ == "${{ matrix.transformers }}"
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          PY

      - name: Run focused checkpointing contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile \
            multiscreen_transformers/modeling_multiscreen.py \
            tests/test_gradient_checkpointing_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_gradient_checkpointing_contract.py' \
            -v

      - name: Run focused paper training contract
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle
        run: |
          python -m py_compile \
            scripts/p0_5_c3_paper_training_contract.py \
            tests/test_paper_training_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_paper_training_contract.py' \
            -v

      - name: Run tokenizer reload verifier fixtures
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle
        run: |
          python -m py_compile \
            scripts/check_tokenizer_reload.py \
            tests/test_tokenizer_reload_check.py
          python -m unittest discover \
            -s tests \
            -p 'test_tokenizer_reload_check.py' \
            -v

  p0-smoke:
    name: P0 CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Show environment
        run: |
          python - <<'PY'
          import sys
          import torch
          import transformers
          print("python:", sys.version)
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("cuda available:", torch.cuda.is_available())
          PY

      - name: Static syntax check
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile \
            multiscreen_transformers/*.py \
            oracle/*.py \
            scripts/*.py \
            p0_2_three_way_minimal/*.py

      - name: P0.5-C1 paper architecture and initialization contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile \
            scripts/generate_paper_scale_manifest.py \
            tests/test_paper_architecture_contract.py \
            tests/test_paper_initialization_contract.py \
            tests/test_packed_text_contract.py
          python -m unittest discover -s tests -p 'test_paper_architecture_contract.py' -v
          python -m unittest discover -s tests -p 'test_paper_initialization_contract.py' -v
          python -m unittest discover -s tests -p 'test_packed_text_contract.py' -v
          python scripts/generate_paper_scale_manifest.py \
            --check docs/validation_results/P0_5_C1_ARCHITECTURE_MANIFEST.json
          python -m json.tool \
            docs/validation_results/P0_5_C1_ARCHITECTURE_MANIFEST.json \
            >/dev/null

      - name: P0.5-C2 MiPE position and cache contracts
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile tests/test_mipe_position_cache_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_mipe_position_cache_contract.py' \
            -v

      - name: P0.5-C3 paper training contract
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python -m py_compile tests/test_paper_training_contract.py
          python -m unittest discover \
            -s tests \
            -p 'test_paper_training_contract.py' \
            -v

      - name: P0-4 static config preflight
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python scripts/p0_4_gpt2_context4096_smoke.py \
            --config-dir configs/p0_4_multiscreen_psi8_gpt2_ctx4096 \
            --validate-config-only
          python scripts/p0_4_gpt2_context4096_smoke.py \
            --config-dir configs/p0_4_multiscreen_psi16_gpt2_ctx4096 \
            --validate-config-only

      - name: P0-4 tiny CPU checkpointed diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
          HF_HUB_DISABLE_XET: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/p0_4_smoke.txt").write_text(
              ("Once upon a time, a small fox learned to share with a friend.\n\n" * 64),
              encoding="utf-8",
          )
          PY
          python scripts/p0_4_gpt2_context4096_smoke.py \
            --config-dir configs/p0_4_multiscreen_psi8_gpt2_ctx4096 \
            --device cpu \
            --allow-cpu true \
            --amp-dtype none \
            --seq-len 16 \
            --steps 8 \
            --gradient-accumulation-steps 1 \
            --microbatch-size 1 \
            --gradient-checkpointing true \
            --fused-adamw false \
            --max-train-tokens 17 \
            --text-file /tmp/p0_4_smoke.txt \
            --output-dir /tmp/p0_4_checkpointed_cpu_diagnostic
          test -f /tmp/p0_4_checkpointed_cpu_diagnostic/P0-4_DIAGNOSTIC_COMPLETE.md
          test ! -f /tmp/p0_4_checkpointed_cpu_diagnostic/P0-4_COMPLETE.md

      - name: P0-1 oracle unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python oracle/test_formula_units.py
          python oracle/test_paper_math_oracle_selfcheck.py
          python oracle/test_paper_math_oracle_smoke.py

      - name: P0-1 HF vs oracle quick sweep
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python oracle/test_against_hf_port.py --quick

      - name: P0-2 three-way quick sweep
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/oracle:${{ github.workspace }}/third_party/multiscreen-pytorch
        run: |
          python p0_2_three_way_minimal/test_three_way_minimal.py \
            --reference-root third_party/multiscreen-pytorch \
            --hf-root . \
            --oracle-root oracle \
            --quick
